model:
  provider: opencode-go
  default: glm-5
  base_url: https://opencode.ai/zen/go/v1

vision:
  provider: openrouter
  model: google/gemini-3.1-flash-lite-preview

agent:
  max_turns: 50

platform_toolsets:
  api_server:
    - web
    - file
    - terminal
    - memory

gateway:
  platforms:
    api_server:
      enabled: true

stt:
  enabled: false
