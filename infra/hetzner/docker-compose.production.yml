# Production overrides for Hetzner deployment
# Usage: docker compose -f docker-compose.yml -f infra/hetzner/docker-compose.production.yml up -d
#
# Ports use !override to replace (not append to) the base port list,
# binding only to 127.0.0.1 so Caddy handles external access.
services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  temporal:
    ports: !override
      - "127.0.0.1:7233:7233"
    restart: unless-stopped

  temporal-ui:
    ports: !override
      - "127.0.0.1:8233:8080"
    restart: unless-stopped

  hermes-gateway:
    ports: !override
      - "127.0.0.1:8642:8642"
    restart: unless-stopped

  hast-api:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  hast-worker:
    restart: unless-stopped

  paperclip:
    ports: !override
      - "127.0.0.1:3100:3100"
    restart: unless-stopped
    environment:
      - PAPERCLIP_PUBLIC_URL=https://lecture.fierro.co.uk
